<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NotSoSimpleCalculator — Welcome</title>
    <style>
      :root{--bg:#0f1724;--card:#ffffff;--accent:#2563eb;--muted:#94a3b8}
      body{margin:0;font-family:Inter,system-ui,Segoe UI,Roboto,Arial,sans-serif;background:linear-gradient(135deg,#eef2ff 0%, #f8fafc 100%);display:flex;align-items:center;justify-content:center;height:100vh}
      .hero{max-width:960px;padding:48px;display:grid;grid-template-columns:1fr 360px;gap:32px;align-items:center}
      .brand{color:#0b1220}
      h1{margin:0 0 12px 0;font-size:34px;line-height:1.05;color:var(--bg)}
      p{margin:0 0 20px;color:var(--muted);font-size:16px}
      .actions{display:flex;gap:12px}
      .btn{display:inline-flex;align-items:center;gap:10px;padding:12px 18px;border-radius:10px;border:0;font-weight:600;cursor:pointer}
      .btn-primary{background:var(--accent);color:white;box-shadow:0 6px 20px rgba(37,99,235,0.18)}
      .btn-ghost{background:transparent;color:var(--bg);border:1px solid rgba(15,23,36,0.08)}
      .card{background:var(--card);border-radius:16px;padding:24px;box-shadow:0 12px 40px rgba(2,6,23,0.08)}
      .preview{height:420px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-weight:600}
      a{color:inherit;text-decoration:none}
      @media(max-width:880px){.hero{grid-template-columns:1fr;gap:20px;padding:28px}.preview{height:300px}}
    </style>
  </head>
  <body>
    <main class="hero">
      <section>
        <div class="brand">
          <h1>NotSoSimpleCalculator</h1>
          <p>Lightweight calculator with expression parsing and server-side evaluation. Quick, accurate, and easy to embed.</p>
        </div>

        <div class="actions">
          <a href="/calculator" class="btn btn-primary">Open Calculator</a>
          <a href="#" class="btn btn-ghost" onclick="showAbout()">About</a>
        </div>
      </section>

      <aside class="card">
        <div class="preview">
          <a href="/calculator">Click to open the calculator →</a>
        </div>
      </aside>
    </main>

    <script>
      function showAbout(){
        alert('NotSoSimpleCalculator — server-backed expression evaluator. Press the big button to open.');
      }
    </script>
  </body>
</html>
