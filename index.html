<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NotSoSimpleCalculator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .calculator {
      background: #1f2a44;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.25);
      width: 320px;
    }
    .display {
      width: 100%;
      height: 50px;
      font-size: 24px;
      text-align: right;
      border: none;
      border-radius: 8px;
      margin-bottom: 15px;
      padding: 0 10px;
      box-sizing: border-box;
      background: #e9eef8;
      color: #1d2940;
    }
    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    button {
      padding: 14px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #e9eef8;
      color: #1d2940;
    }
    button:hover { background: #d7e1f4; }
    .operator { background: #ff9f43; color: white; }
    .operator:hover { background: #f28a00; }
    .equal { background: #2ecc71; color: white; }
    .equal:hover { background: #27ae60; }
    .clear { background: #e74c3c; color: white; }
    .clear:hover { background: #c0392b; }
    .status {
      margin-top: 12px;
      color: #f1c40f;
      min-height: 20px;
    }
  </style>
</head>
<body>
  <div class="calculator">
    <input class="display" id="display" type="text" value="0" readonly />
    <div class="buttons">
      <button onclick="append('7')">7</button>
      <button onclick="append('8')">8</button>
      <button onclick="append('9')">9</button>
      <button class="operator" onclick="append('/')">/</button>

      <button onclick="append('4')">4</button>
      <button onclick="append('5')">5</button>
      <button onclick="append('6')">6</button>
      <button class="operator" onclick="append('*')">*</button>

      <button onclick="append('1')">1</button>
      <button onclick="append('2')">2</button>
      <button onclick="append('3')">3</button>
      <button class="operator" onclick="append('-')">-</button>

      <button onclick="append('0')">0</button>
      <button onclick="append('.')">.</button>
      <button class="equal" onclick="calculate()">=</button>
      <button class="operator" onclick="append('+')">+</button>

      <button class="clear" onclick="clearDisplay()">C</button>
      <button onclick="backspace()">DEL</button>
    </div>
    <div class="status" id="status"></div>
  </div>

  <script>
    const display = document.getElementById('display');
    const status = document.getElementById('status');

    document.addEventListener('keydown', function (event) {
      const key = event.key;
      if (/^[0-9.]$/.test(key)) {
        event.preventDefault();
        append(key);
      } else if (['+', '-', '*', '/'].includes(key)) {
        event.preventDefault();
        append(key);
      } else if (key === 'Enter') {
        event.preventDefault();
        calculate();
      } else if (key === 'Backspace') {
        event.preventDefault();
        backspace();
      } else if (key === 'Escape') {
        event.preventDefault();
        clearDisplay();
      }
    });

    function append(value) {
      const current = display.value;
      if (current === '0' && value !== '.') {
        display.value = value;
      } else if (current === '0' && value === '.') {
        display.value = '0.';
      } else {
        display.value += value;
      }
      status.textContent = '';
    }

    function clearDisplay() {
      display.value = '0';
      status.textContent = '';
    }

    function backspace() {
      const current = display.value;
      if (current.length <= 1) {
        display.value = '0';
      } else {
        display.value = current.slice(0, -1);
      }
      status.textContent = '';
    }

    async function calculate() {
      const expression = display.value;
      try {
        const response = await fetch(`/api/calculate?expression=${encodeURIComponent(expression)}`);
        const result = await response.json();
        if (response.ok) {
          display.value = result.result;
          status.textContent = '';
        } else {
          status.textContent = result.error || 'Calculation failed';
        }
      } catch (error) {
        status.textContent = 'Server unavailable';
      }
    }
  </script>
</body>
</html>
