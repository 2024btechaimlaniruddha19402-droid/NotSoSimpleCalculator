<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NotSoSimpleCalculator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .calculator {
      background: #1f2a44;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.25);
      width: 320px;
    }
    .display {
      width: 100%;
      height: 50px;
      font-size: 24px;
      text-align: right;
      border: none;
      border-radius: 8px;
      margin-bottom: 15px;
      padding: 0 10px;
      box-sizing: border-box;
    }
    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    button {
      padding: 14px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #e9eef8;
      color: #1d2940;
    }
    button:hover { background: #d7e1f4; }
    .operator { background: #ff9f43; color: white; }
    .operator:hover { background: #f28a00; }
    .equal { background: #2ecc71; color: white; }
    .equal:hover { background: #27ae60; }
    .clear { background: #e74c3c; color: white; }
    .clear:hover { background: #c0392b; }
  </style>
</head>
<body>
  <div class="calculator">
    <input class="display" id="display" type="text" value="0" readonly />
    <div class="buttons">
      <button onclick="append('7')">7</button>
      <button onclick="append('8')">8</button>
      <button onclick="append('9')">9</button>
      <button class="operator" onclick="append('/')">/</button>

      <button onclick="append('4')">4</button>
      <button onclick="append('5')">5</button>
      <button onclick="append('6')">6</button>
      <button class="operator" onclick="append('*')">*</button>

      <button onclick="append('1')">1</button>
      <button onclick="append('2')">2</button>
      <button onclick="append('3')">3</button>
      <button class="operator" onclick="append('-')">-</button>

      <button onclick="append('0')">0</button>
      <button onclick="append('.')">.</button>
      <button class="equal" onclick="calculate()">=</button>
      <button class="operator" onclick="append('+')">+</button>

      <button class="clear" onclick="clearDisplay()">C</button>
      <button onclick="backspace()">DEL</button>
    </div>
  </div>

  <script>
    const display = document.getElementById('display');

    document.addEventListener('keydown', function (event) {
      const key = event.key;

      if (/^[0-9.]$/.test(key)) {
        event.preventDefault();
        append(key);
      } else if (['+', '-', '*', '/'].includes(key)) {
        event.preventDefault();
        append(key);
      } else if (key === 'Enter') {
        event.preventDefault();
        calculate();
      } else if (key === 'Backspace') {
        event.preventDefault();
        backspace();
      } else if (key === 'Escape') {
        event.preventDefault();
        clearDisplay();
      }
    });

    function append(value) {
      const current = display.value;
      if (current === '0' && value !== '.') {
        display.value = value;
      } else if (current === '0' && value === '.') {
        display.value = '0.';
      } else {
        display.value += value;
      }
    }

    function clearDisplay() {
      display.value = '0';
    }

    function backspace() {
      const current = display.value;
      if (current.length <= 1) {
        display.value = '0';
      } else {
        display.value = current.slice(0, -1);
      }
    }

    function calculate() {
      try {
        display.value = evaluateExpression(display.value);
      } catch (e) {
        display.value = 'Error';
      }
    }

    function evaluateExpression(expression) {
      const tokens = tokenize(expression);
      const values = [];
      const ops = [];

      for (const token of tokens) {
        if (!isNaN(token)) {
          values.push(parseFloat(token));
        } else if (token === '(') {
          ops.push(token);
        } else if (token === ')') {
          while (ops.length && ops[ops.length - 1] !== '(') {
            applyOperator(values, ops.pop());
          }
          ops.pop();
        } else {
          while (ops.length && shouldPopOperator(ops[ops.length - 1], token)) {
            applyOperator(values, ops.pop());
          }
          ops.push(token);
        }
      }

      while (ops.length) {
        applyOperator(values, ops.pop());
      }

      if (values.length === 0) return '0';
      const result = values.pop();
      return Number.isInteger(result) ? String(result) : result.toFixed(10).replace(/0+$/, '').replace(/\.$/, '');
    }

    function tokenize(expression) {
      const tokens = [];
      let current = '';
      for (const ch of expression) {
        if (/[0-9.]/.test(ch)) {
          current += ch;
        } else {
          if (current) {
            tokens.push(current);
            current = '';
          }
          if ('()+-*/'.includes(ch)) {
            tokens.push(ch);
          }
        }
      }
      if (current) tokens.push(current);
      return tokens;
    }

    function shouldPopOperator(top, incoming) {
      if (top === '(') return false;
      return precedence(top) >= precedence(incoming);
    }

    function precedence(op) {
      if (op === '+' || op === '-') return 1;
      if (op === '*' || op === '/') return 2;
      return 0;
    }

    function applyOperator(values, op) {
      const right = values.pop();
      const left = values.pop();
      let result = 0;
      switch (op) {
        case '+': result = left + right; break;
        case '-': result = left - right; break;
        case '*': result = left * right; break;
        case '/': result = left / right; break;
      }
      values.push(result);
    }
  </script>
</body>
</html>
